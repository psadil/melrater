[metric.stripe]
title = "stripe and ghosting pattern"
body = """
Smooths the map before and after taking its absolute value and takes the 95th \
percentile of the difference. The two agree on a smooth map and diverge on a \
fine alternating one, so a large value points at striping or Nyquist \
ghosting."""
source = "stripe"

[metric.dim]
title = "image dimensions"
body = """
Matrix size of the input 4D data: x, y, z, and the number of volumes. These are \
the same for every component in a run, so melrater drops them before z-scoring \
and they never appear in the list below."""
source = "dim"
columns = [
  "x dimension, in voxels",
  "y dimension, in voxels",
  "z dimension, in voxels",
  "number of volumes",
]

[metric.pixdim]
title = "voxel dimensions"
body = """
Voxel size along each axis and the repetition time, straight from the NIfTI \
header. These are the same for every component in a run, so melrater drops them \
before z-scoring and they never appear in the list below."""
source = "pixdim"
columns = [
  "voxel size along x, in mm",
  "voxel size along y, in mm",
  "voxel size along z, in mm",
  "repetition time, in seconds",
]


