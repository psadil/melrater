[workspace]
authors = ["Patrick Sadil <psadil@gmail.com>"]
channels = ["conda-forge"]
name = "melrater"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

# applies to every task and pixi shell: puts the src/ layout on the import
# path and points Django at its settings, so no manage.py shim is needed
# (pixi run manage == python -m django)
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
DJANGO_SETTINGS_MODULE = "config.settings"
# "this is a source checkout": settings.py takes its developer defaults from
# this, and it can never reach the container, because pixi's activation applies
# to `pixi run` only and pixi is not on the runtime image (see the Dockerfile's
# four ENV lines). Deliberately not MELRATER_DEBUG itself — activation.env
# overrides the inherited environment, so `MELRATER_DEBUG=0 pixi run manage
# check --deploy` would silently still be checking a debug server.
MELRATER_DEV = "1"

[tasks]
manage = "python -m django"
collectstatic = "python -m django collectstatic --noinput"
# The production system checks, run against production-shaped settings. The
# values are throwaways; the point is DEBUG off and a proxy in front.
check-deploy = { cmd = "python -m django check --deploy", env = { MELRATER_DEBUG = "0", MELRATER_SECRET_KEY = "check-only-throwaway", MELRATER_ALLOWED_HOSTS = "example.invalid", MELRATER_CSRF_TRUSTED_ORIGINS = "https://example.invalid", MELRATER_BEHIND_TLS_PROXY = "1" } }
# Refresh the typed catalog vocabulary (melrater/core/_lake_models.py) from a
# feat-adapter catalog, after re-indexing or a bidslake bump:
#   pixi run regen-lake-models path/to/study.duckdb
regen-lake-models = "python -m bidslake.stubgen --out src/melrater/core/_lake_models.py"
# async server: granian on uvloop; Django implements no lifespan protocol, so
# the interface is asginl, and granian serves the collected static files itself
serve = { cmd = [
    "granian",
    "config.asgi:application",
    "--interface",
    "asginl",
    "--host",
    "127.0.0.1",
    "--port",
    "8000",
    "--no-ws",
    "--workers",
    "2",
    "--runtime-mode",
    "st",
    "--loop",
    "uvloop",
    "--static-path-route",
    "/static",
    "--static-path-mount",
    "staticfiles",
], depends-on = ["collectstatic"] }

[dependencies]
# 3.14 is bidslake's floor; everything else moved up with it
python = "3.14.*"
nibabel = ">=5.3"
numpy = ">=2"
pillow = ">=11"
django = ">=6"
pydantic = ">=2"
granian = ">=2.6"
uvloop = ">=0.22"
# 12-factor config: typed casts and explicit defaults for the MELRATER_* env
# variables, so "DEBUG is off unless someone says otherwise" is one declaration
# rather than a string comparison.
django-environ = ">=0.14"
# login throttling. The lockout tables are ordinary migrations, so the
# entrypoint's `migrate` installs them with everything else. It also covers the
# ingest API for free: that endpoint authenticates through django.contrib.auth,
# so AxesStandaloneBackend sees a bad push password like any other bad login.
django-axes = ">=8.3"
# the ingest API (melrater/core/api.py) and its client (push.py). django-ninja
# rather than DRF: two endpoints, pydantic schemas shared with schemas.py, and
# no serializer layer to duplicate them in.
django-ninja = ">=1.6"
httpx = ">=0.28"
# build toolchain for the bidslake pypi dependency (a PyO3/maturin extension,
# compiled at install time)
rust = "*"
maturin = ">=1.7,<2"

# linux only: conda's C/C++ toolchain. bidslake is a maturin/PyO3 extension whose
# duckdb backend is compiled from bundled C++ by cc-rs, so the container build
# needs a compiler; taking it from conda keeps that C++ and conda's rust linker
# on one sysroot (a system gcc resolves against Ubuntu's newer glibc instead and
# leaves undefined __isoc23_* symbols behind). macOS uses the Xcode clang.
[target.linux-64.dependencies]
gcc_linux-64 = "*"
gxx_linux-64 = "*"

[pypi-dependencies]
# conda-forge pillow is not built against libavif; this plugin supplies the codec
pillow-avif-plugin = "*"
django-typer = "*"
# bidslake query layer: typed access to the catalog `import_run` reads, pinned to
# a rev (built from git via maturin/rust at install time). The pin is the first
# rev whose feat adapter carries everything melrater needs: the
# `spectrum`/`metrics` suffixes, the melodic_ftmix/melodic_icstats/melodic_mean/
# fix_features roles, and the `feat_icstats` table. Catalogs must be indexed with
# a `bidslake` CLI built from this rev or later.
bidslake = { git = "https://github.com/psadil/bidslake.git", rev = "93d6e6dfa6a65dc667b256d8365220adf04c7951", subdirectory = "crates/bidslake-py" }

[feature.dev.tasks]
test = "pytest"
test-e2e = "pytest -m e2e"
install-browsers = "playwright install chromium"

[feature.dev.dependencies]
ty = "*"
ruff = "*"
pytest = ">=8"
pytest-django = ">=4.9"
playwright = "*"
pytest-playwright = "*"
# PEP 561 stubs only (no mypy plugin): enough for ty to resolve managers,
# field descriptor values, and request.user
django-stubs = ">=5.2"

[environments]
dev = ["dev"]
