[workspace]
authors = ["Patrick Sadil <psadil@gmail.com>"]
channels = ["conda-forge"]
name = "melrater"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
manage = "python manage.py"
collectstatic = "python manage.py collectstatic --noinput"
# async server: granian on uvloop; Django implements no lifespan protocol, so
# the interface is asginl, and granian serves the collected static files itself
serve = { cmd = [
    "granian",
    "config.asgi:application",
    "--interface",
    "asginl",
    "--host",
    "127.0.0.1",
    "--port",
    "8000",
    "--no-ws",
    "--workers",
    "2",
    "--runtime-mode",
    "st",
    "--loop",
    "uvloop",
    "--static-path-route",
    "/static",
    "--static-path-mount",
    "staticfiles",
], env = { PYTHONPATH = "src" }, depends-on = ["collectstatic"] }

[dependencies]
python = "3.13.*"
nibabel = ">=5.3"
numpy = ">=2"
pillow = ">=11"
django = ">=6"
pydantic = ">=2"
granian = ">=2.6"
uvloop = ">=0.22"

[pypi-dependencies]
# conda-forge pillow is not built against libavif; this plugin supplies the codec
pillow-avif-plugin = "*"

[feature.dev.tasks]
test = "pytest"
test-e2e = "pytest -m e2e"
install-browsers = "playwright install chromium"

[feature.dev.dependencies]
ty = "*"
ruff = "*"
pytest = ">=8"
pytest-django = ">=4.9"
playwright = "*"
pytest-playwright = "*"
# PEP 561 stubs only (no mypy plugin): enough for ty to resolve managers,
# field descriptor values, and request.user
django-stubs = ">=5.2"

[environments]
dev = ["dev"]
