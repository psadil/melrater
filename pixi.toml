[workspace]
authors = ["Patrick Sadil <psadil@gmail.com>"]
channels = ["conda-forge"]
name = "melrater"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
manage = "python manage.py"
serve = "python manage.py runserver"

[dependencies]
python = "3.13.*"
nibabel = ">=5.3"
numpy = ">=2"
pillow = ">=11"
django = ">=6"
pydantic = ">=2"

[pypi-dependencies]
# conda-forge pillow is not built against libavif; this plugin supplies the codec
pillow-avif-plugin = "*"

[feature.dev.tasks]
test = "pytest"
test-e2e = "pytest -m e2e"
install-browsers = "playwright install chromium"

[feature.dev.dependencies]
ty = "*"
ruff = "*"
pytest = ">=8"
pytest-django = ">=4.9"
playwright = "*"
pytest-playwright = "*"

[environments]
dev = ["dev"]
