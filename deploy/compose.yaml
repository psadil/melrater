# The deployed stack. rsynced to /srv/melrater/compose.yaml by deploy/deploy.sh;
# edit it here, never on the server, or the next deploy overwrites your change.
#
# Every value that names the box comes from MELRATER_HOST in /srv/melrater/.env,
# because the address has to agree in four places and each disagreement fails
# differently and silently: a wrong ALLOWED_HOSTS 400s every request, a wrong
# CSRF_TRUSTED_ORIGINS 403s every POST, and a wrong default_sni kills the TLS
# handshake while the log still says the certificate was obtained successfully.
name: melrater

services:
  melrater:
    # deploy.sh exports MELRATER_TAG over ssh; the default is what a bare
    # `docker compose up -d` on the box uses.
    image: ${MELRATER_TAG:-psadil/melrater:latest}
    restart: unless-stopped
    # no ports: only caddy touches the host network stack, which is also what
    # makes MELRATER_BEHIND_TLS_PROXY safe — nothing but the proxy can set
    # X-Forwarded-Proto if the app is unreachable any other way.
    environment:
      MELRATER_DEBUG: "0"
      MELRATER_SECRET_KEY: ${MELRATER_SECRET_KEY:?set it in /srv/melrater/.env}
      # keep 127.0.0.1 so the healthcheck is not a DisallowedHost. No spaces
      # after the comma — the setting is split on "," with no trimming.
      MELRATER_ALLOWED_HOSTS: ${MELRATER_HOST:?set it in /srv/melrater/.env},127.0.0.1
      MELRATER_CSRF_TRUSTED_ORIGINS: https://${MELRATER_HOST}
      MELRATER_BEHIND_TLS_PROXY: "1"
    volumes:
      # absolute, so they do not depend on where compose is run from
      - /srv/melrater/db:/app/db
      - /srv/melrater/media:/app/media
    # Measured steady state is ~400 MB with two granian workers; this is roughly
    # 4x headroom. The point is not to be tight, it is to make the kernel kill
    # this container rather than pick its own victim under memory pressure —
    # an OOM that takes sshd or dockerd locks you out of the box you need to fix.
    # Confirm against your instance with: docker stats --no-stream
    mem_limit: 1500m
    # /accounts/login/ rather than /, which is a 302. The base image has neither
    # curl nor wget, but the pixi environment's python is on PATH. start_period
    # has to cover the entrypoint's migrate.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy expands {$MELRATER_HOST} in the Caddyfile from its OWN environment,
    # which is a different mechanism from compose's ${...} above even though
    # both end up reading /srv/melrater/.env. It has to be passed in explicitly.
    environment:
      MELRATER_HOST: ${MELRATER_HOST:?set it in /srv/melrater/.env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - /srv/melrater/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/melrater/caddy/data:/data     # certificates; must persist
      - /srv/melrater/caddy/config:/config
    # the app service's logs are capped above; caddy would otherwise inherit
    # docker's unbounded default onto the same disk as db.sqlite3, and a full
    # disk here surfaces as SQLite write failures rather than as a disk error
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
