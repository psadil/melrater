[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# generated by makemigrations; not hand-maintained
"melrater/core/migrations/*" = ["RUF012"]

[tool.ty.src]
include = ["config", "melrater", "mockups", "tests", "manage.py"]

# Django builds managers, reverse relations, and field descriptor values at
# runtime, which static checkers cannot see without a Django plugin (ty has
# none). Relax the affected rules ONLY in the thin ORM glue; the domain-logic
# modules (melodic, metrics, montage, charts) stay fully checked.
[[tool.ty.overrides]]
include = [
    "melrater/core/models.py",
    "melrater/core/admin.py",
    "melrater/core/services.py",
    "melrater/core/selectors.py",
    "melrater/core/views.py",
    "melrater/core/management/**",
    "tests/**",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
