[tool.ruff]
# stubgen-generated catalog vocabulary (see `pixi run regen-lake-models`):
# regenerated verbatim, so neither linted nor reformatted
extend-exclude = ["src/melrater/core/_lake_models.py"]

# There is no [project] table for ruff to read requires-python from, so it
# assumes an older interpreter than pixi.toml pins and sorts tomllib (3.11+)
# into the third-party block. Naming it here fixes the sort without setting
# target-version, which would also let the formatter rewrite unrelated files
# into 3.14-only syntax.
[tool.ruff.lint.isort]
extra-standard-library = ["tomllib"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: browser tests via playwright (run with: pixi run -e dev test-e2e)"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
root = ["./src", "."]
# check against the dev env, where django-stubs (PEP 561 stubs, no mypy
# plugin) makes managers, field descriptor values, and request.user resolve;
# reverse FK accessors are declared as stub-only annotations on the models
python = ".pixi/envs/dev"
