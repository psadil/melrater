[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: browser tests via playwright (run with: pixi run -e dev test-e2e)"]

[tool.ty.src]
include = ["src", "tests", "manage.py"]

[tool.ty.environment]
root = ["./src", "."]

# Django attaches managers (`Model.objects`), reverse relations, and
# `request.user` at runtime; ty has no Django plugin (still true on Django 6),
# so this single rule false-positives on every ORM touch. It stays ignored
# ONLY in the query/service layer and its tests; field-value typing in views
# is handled with explicit casts at the model boundary instead of ignores.
[[tool.ty.overrides]]
include = [
    "src/melrater/core/services.py",
    "src/melrater/core/selectors.py",
    "src/melrater/core/views.py",
    "src/melrater/core/management/**",
    "tests/**",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
